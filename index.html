<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câmera Cine</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Câmera Cine">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f5f5f7;--mut:#a1a1aa;--ac:#ff3b30;--gd:#f5c451;--pn:rgba(18,18,22,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#v,#c{width:100%;height:100%;object-fit:contain;background:#000}
#c{position:absolute;inset:0;display:none}
.mir{transform:scaleX(-1)}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
#top{top:env(safe-area-inset-top,0px)}
#bot{bottom:env(safe-area-inset-bottom,0px);flex-direction:column;gap:12px;padding-bottom:18px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.chip,select,.ib{background:var(--pn);color:var(--fg);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
select{appearance:none}
#cine.on{background:var(--gd);color:#111;font-weight:700;border-color:var(--gd)}
#info{font-variant-numeric:tabular-nums;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-around;width:100%;max-width:480px}
.tabs{display:flex;gap:22px;font-size:13px;letter-spacing:.12em;font-weight:600}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;padding:4px}
.tabs button.on{color:var(--gd)}
#shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;position:relative}
#shut::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;transition:.15s}
#shut.vid::after{background:var(--ac)}
#shut.rec::after{inset:20px;border-radius:8px;background:var(--ac)}
.ib{width:52px;height:52px;padding:0;display:grid;place-items:center;font-size:22px;overflow:hidden}
#thumb img,#thumb video{width:100%;height:100%;object-fit:cover}
#rec{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);background:var(--ac);padding:4px 12px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;display:none}
#zoomw{display:none;width:100%;max-width:320px}
#zoom{width:100%;accent-color:var(--gd)}
#msg{position:absolute;top:50%;left:20px;right:20px;transform:translateY(-50%);text-align:center;color:var(--mut);display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#gal{position:absolute;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#gal.show{display:flex}
#gview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#gview img,#gview video{max-width:100%;max-height:100%}
#gstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
#gstrip>*{height:56px;width:56px;object-fit:cover;border-radius:8px;flex:none;opacity:.6}
#gstrip>.sel{opacity:1;outline:2px solid var(--gd)}
.gb{display:flex;gap:10px;justify-content:space-between}
.gb a,.gb button{flex:1;text-align:center;text-decoration:none;color:var(--fg)}
#perm{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;padding:24px}
#perm.hide{display:none}
.pc{max-width:360px;text-align:center}
.pi{font-size:56px;margin-bottom:8px}
.pc h1{margin:0 0 10px;font-size:26px}
.pc p{color:var(--mut);line-height:1.5;margin:0 0 22px;font-size:15px}
#allow{width:100%;background:var(--gd);color:#111;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700}
#perr{color:#ff6b61!important;font-size:13px!important;margin:16px 0 0!important}
#audw{display:none;align-items:center;gap:8px;padding:0 14px;width:100%;max-width:480px}
#meter{flex:none;width:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34c759 60%,#ffcc00 80%,#ff3b30);transition:width .06s}
#audw select{flex:1;min-width:0;padding:6px 10px;font-size:12px;text-overflow:ellipsis}
#cfgw{display:none;width:100%}
#looks{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
#looks::-webkit-scrollbar{display:none}
.lk{flex:none;background:var(--pn);color:var(--fg);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;font-size:13px}
.lk.on{background:var(--gd);color:#111;border-color:var(--gd);font-weight:700}
#cfg{display:flex;gap:8px;justify-content:center}
#cfg select{padding:6px 12px;font-size:12px}
</style>
</head>
<body>
<div id="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas></div>
<div id="flash"></div>
<div id="msg"></div>
<div id="perm"><div class="pc"><div class="pi">🎬</div><h1>Câmera Cine</h1><p>Para tirar fotos e gravar vídeos, o app precisa de acesso à sua câmera e ao seu microfone.</p><button id="allow">Permitir acesso</button><p id="perr"></p></div></div>
<div id="rec">● 00:00</div>
<div class="bar" id="top">
  <select id="res" aria-label="Resolução"><option value="max">Máxima (até 8K)</option><option value="4k">4K</option><option value="1080">Full HD</option></select>
  <span class="chip" id="info">—</span>
  <button class="chip" id="cine">🎬 Cinema</button>
</div>
<div class="bar" id="bot">
  <div id="zoomw"><input type="range" id="zoom" aria-label="Zoom"></div>
  <div id="audw"><span>🎙️</span><div id="meter"><i></i></div><select id="mic" aria-label="Microfone"></select><select id="amode" aria-label="Modo de áudio"><option value="studio">Áudio Estúdio</option><option value="voz">Voz limpa</option></select></div>
<div id="cfgw"><div id="looks"></div><div id="cfg"><select id="asp" aria-label="Formato"><option value="2.39">Cinemascope 2.39:1</option><option value="1.85">Widescreen 1.85:1</option><option value="1.78">Tela larga 16:9</option><option value="1.43">IMAX 1.43:1</option><option value="1.37">Clássico 1.37:1</option><option value="0">Original</option></select><select id="fps" aria-label="Quadros por segundo"><option value="24">24 fps · Cinema</option><option value="30">30 fps</option><option value="60">60 fps</option></select></div></div>
<div class="tabs"><button id="tp" class="on">FOTO</button><button id="tv">VÍDEO</button></div>
  <div class="row">
    <button class="ib" id="thumb" aria-label="Galeria">🖼️</button>
    <button id="shut" aria-label="Capturar"></button>
    <button class="ib" id="flip" aria-label="Virar câmera">🔄</button>
  </div>
</div>
<div id="gal"><div id="gview"></div><div id="gstrip"></div><div class="gb"><button class="chip" id="gclose">Fechar</button><a class="chip" id="gdl" download>Baixar</a></div></div>

<script>
const $=s=>document.querySelector(s);
const v=$('#v'),c=$('#c'),ctx=c.getContext('2d');
let wl=null,stream,facing='environment',mode='photo',cine=false,mr=null,chunks=[],timer,t0,shots=[],cur=-1,cstream=null;

const RES={max:{width:{ideal:7680},height:{ideal:4320},frameRate:{ideal:60}},'4k':{width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}},'1080':{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}};
function msg(t){const m=$('#msg');m.textContent=t||'';m.style.display=t?'block':'none'}

async function start(){
  if(mr)return;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const vid={facingMode:{ideal:facing},...RES[$('#res').value]};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:vid,audio:AUD()});
  }catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({video:vid})}
    catch(e2){msg('Permita o acesso à câmera para usar o app. Se estiver vendo isto dentro de uma janela incorporada, abra a página em tela cheia.');return}
  }
  msg('');
  const tr=stream.getVideoTracks()[0];
  // tenta forçar a maior resolução suportada pelo sensor
  try{
    const cp=tr.getCapabilities?.()||{};
    if($('#res').value==='max'&&cp.width&&cp.height)await tr.applyConstraints({width:cp.width.max,height:cp.height.max,...(cp.frameRate?{frameRate:Math.min(60,cp.frameRate.max)}:{})});
    if(cp.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
  }catch(e){}
  v.srcObject=stream;await v.play().catch(()=>{});meter();updMics();
  const s=tr.getSettings();
  $('#info').textContent=`${s.width}×${s.height} · ${Math.round(s.frameRate||0)}fps`;
  const cp=tr.getCapabilities?.()||{};
  if(cp.zoom){const z=$('#zoom');z.min=cp.zoom.min;z.max=cp.zoom.max;z.step=cp.zoom.step||.1;z.value=s.zoom||cp.zoom.min;$('#zoomw').style.display='block'}else $('#zoomw').style.display='none';
  const m=facing==='user';v.classList.toggle('mir',m);c.classList.toggle('mir',m);
}
$('#zoom').oninput=e=>stream?.getVideoTracks()[0].applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{});

/* ===== Look cinematográfico: 2.39:1, contraste, teal & orange, vinheta e grão ===== */
const gr=document.createElement('canvas');gr.width=gr.height=256;
(()=>{const g=gr.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const n=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=n;d.data[i+3]=255}g.putImageData(d,0,0)})();
const canF='filter'in ctx;
const LOOKS={
 cinema:{n:'🎬 Cinema',f:'contrast(1.18) saturate(1.12) brightness(.97)',o:[['soft-light','#1d6c8a',.4],['overlay','#ff9a3c',.14]],g:.07,v:.55},
 blockbuster:{n:'💥 Blockbuster',f:'contrast(1.3) saturate(1.25) brightness(.95)',o:[['soft-light','#0a5a7a',.55],['overlay','#ff8a2a',.22]],g:.05,v:.6},
 noir:{n:'🕵️ Noir P&B',f:'grayscale(1) contrast(1.5) brightness(.92)',o:[],g:.12,v:.7},
 vintage:{n:'📼 Anos 70',f:'sepia(.35) contrast(1.08) saturate(1.3) brightness(1.02)',o:[['overlay','#ff9f4a',.25],['soft-light','#7a4a2a',.25]],g:.14,v:.5},
 western:{n:'🤠 Faroeste',f:'sepia(.7) contrast(1.15) saturate(1.1)',o:[['overlay','#d98b3a',.3]],g:.1,v:.6},
 matrix:{n:'🟢 Matrix',f:'contrast(1.25) saturate(.7) brightness(.95)',o:[['soft-light','#00ff55',.45],['multiply','#7cffb0',.25]],g:.06,v:.55},
 cyber:{n:'🌆 Cyberpunk',f:'contrast(1.25) saturate(1.5)',o:[['soft-light','#ff2bd6',.4],['overlay','#00e5ff',.2]],g:.05,v:.5},
 scifi:{n:'🚀 Sci-Fi',f:'contrast(1.2) saturate(.9) brightness(1.02)',o:[['soft-light','#3a7bff',.45],['overlay','#9ad7ff',.12]],g:.04,v:.5},
 terror:{n:'👻 Terror',f:'contrast(1.35) saturate(.5) brightness(.8)',o:[['soft-light','#1a3a3a',.5]],g:.12,v:.8},
 guerra:{n:'🪖 Guerra',f:'contrast(1.35) saturate(.55) brightness(.92)',o:[['overlay','#8a8f6a',.3]],g:.1,v:.6},
 sonho:{n:'✨ Sonho',f:'contrast(.95) saturate(1.15) brightness(1.08)',o:[['soft-light','#ffb6d9',.3]],g:.03,v:.35,bloom:1}
};
let look='cinema',asp='2.39';
function grade(src,w,h,x,cv){
  const L=LOOKS[look],r=+asp;let sw=w,sh=h;
  if(r&&w>=h){if(w/h>r)sw=h*r;else sh=w/r}
  sw=Math.round(sw/2)*2;sh=Math.round(sh/2)*2;
  const sx=(w-sw)/2,sy=(h-sh)/2;
  if(cv.width!==sw||cv.height!==sh){cv.width=sw;cv.height=sh}
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.filter=canF?L.f:'none';x.drawImage(src,sx,sy,sw,sh,0,0,sw,sh);x.filter='none';
  if(!canF&&L.f.includes('grayscale')){x.globalCompositeOperation='saturation';x.fillStyle='#808080';x.fillRect(0,0,sw,sh)}
  L.o.forEach(([m,col,a])=>{x.globalCompositeOperation=m;x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,sw,sh)});
  if(L.bloom&&canF){x.globalCompositeOperation='screen';x.globalAlpha=.35;x.filter='blur('+Math.round(sw/160)+'px) brightness(1.25)';x.drawImage(cv,0,0);x.filter='none'}
  x.globalCompositeOperation='overlay';x.globalAlpha=L.g;x.fillStyle=x.createPattern(gr,'repeat');
  x.save();x.translate(Math.random()*256,Math.random()*256);x.fillRect(-256,-256,sw+512,sh+512);x.restore();
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  const g=x.createRadialGradient(sw/2,sh/2,Math.min(sw,sh)*.35,sw/2,sh/2,Math.max(sw,sh)*.7);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+L.v+')');
  x.fillStyle=g;x.fillRect(0,0,sw,sh);
}
function gradeOld(src,w,h,ctx2,cv){
  const ch=w>h?Math.round(w/2.39):h, sy=(h-ch)/2;
  if(cv.width!==w||cv.height!==ch){cv.width=w;cv.height=ch}
  if(canF)ctx2.filter='contrast(1.18) saturate(1.12) brightness(.97)';
  ctx2.globalCompositeOperation='source-over';
  ctx2.drawImage(src,0,sy,w,ch,0,0,w,ch);
  ctx2.filter='none';
  ctx2.globalCompositeOperation='soft-light';ctx2.globalAlpha=.4;ctx2.fillStyle='#1d6c8a';ctx2.fillRect(0,0,w,ch);
  ctx2.globalCompositeOperation='overlay';ctx2.globalAlpha=.14;ctx2.fillStyle='#ff9a3c';ctx2.fillRect(0,0,w,ch);
  ctx2.globalCompositeOperation='overlay';ctx2.globalAlpha=.07;
  ctx2.fillStyle=ctx2.createPattern(gr,'repeat');ctx2.save();ctx2.translate(Math.random()*256,Math.random()*256);ctx2.fillRect(-256,-256,w+512,ch+512);ctx2.restore();
  ctx2.globalCompositeOperation='source-over';ctx2.globalAlpha=1;
  const v2=ctx2.createRadialGradient(w/2,ch/2,Math.min(w,ch)*.35,w/2,ch/2,Math.max(w,ch)*.7);
  v2.addColorStop(0,'rgba(0,0,0,0)');v2.addColorStop(1,'rgba(0,0,0,.55)');
  ctx2.fillStyle=v2;ctx2.fillRect(0,0,w,ch);
}
/* ===== Áudio avançado: estéreo, 48 kHz, 24 bits, sem processamento, escolha de microfone e medidor ===== */
function AUD(){
  const voz=$('#amode').value==='voz';
  const o={echoCancellation:voz,noiseSuppression:voz,autoGainControl:voz,channelCount:{ideal:2},sampleRate:{ideal:48000},sampleSize:{ideal:24},latency:{ideal:0}};
  const id=$('#mic').value;if(id)o.deviceId={ideal:id};return o;
}
async function updMics(){
  try{
    const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='audioinput');
    const s=$('#mic'),cur=s.value;
    s.innerHTML=d.map((x,i)=>`<option value="${x.deviceId}">${x.label||'Microfone '+(i+1)}</option>`).join('');
    if(cur&&d.some(x=>x.deviceId===cur))s.value=cur;
  }catch(e){}
}
let ac,an,mdata;
function meter(){
  try{ac&&ac.close()}catch(e){}
  an=null;const at=stream.getAudioTracks()[0];if(!at)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume?.();
    const sr=ac.createMediaStreamSource(new MediaStream([at]));
    an=ac.createAnalyser();an.fftSize=1024;sr.connect(an);mdata=new Uint8Array(an.fftSize);
  }catch(e){an=null}
}
function loop(){
  if(an){an.getByteTimeDomainData(mdata);let m=0;for(let i=0;i<mdata.length;i++)m=Math.max(m,Math.abs(mdata[i]-128));$('#meter i').style.width=Math.min(100,m/128*150)+'%'}
  if(cine&&v.videoWidth)grade(v,v.videoWidth,v.videoHeight,ctx,c);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function setCine(on){if(mr)return;cine=on;$('#cine').classList.toggle('on',cine);c.style.display=cine?'block':'none';$('#cfgw').style.display=cine?'block':'none'}
$('#cine').onclick=()=>setCine(!cine);
const lk=$('#looks');
Object.entries(LOOKS).forEach(([k,L])=>{const b=document.createElement('button');b.className='lk'+(k===look?' on':'');b.textContent=L.n;
  b.onclick=()=>{if(mr)return;look=k;setCine(true);[...lk.children].forEach(e=>e.classList.toggle('on',e===b))};lk.appendChild(b)});
$('#asp').onchange=e=>{if(!mr)asp=e.target.value};

/* ===== Foto ===== */
async function photo(){
  navigator.vibrate?.(20);$('#flash').style.opacity=.8;setTimeout(()=>$('#flash').style.opacity=0,120);
  let blob=null;
  if(cine){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',1))}
  else{
    try{
      const ic=new ImageCapture(stream.getVideoTracks()[0]);
      const pc=await ic.getPhotoCapabilities();
      blob=await ic.takePhoto({imageWidth:pc.imageWidth?.max,imageHeight:pc.imageHeight?.max,fillLightMode:'off'});
    }catch(e){blob=null}
    if(!blob){const t=document.createElement('canvas');t.width=v.videoWidth;t.height=v.videoHeight;t.getContext('2d').drawImage(v,0,0);blob=await new Promise(r=>t.toBlob(r,'image/jpeg',1))}
  }
  add(blob,'image');
}

/* ===== Vídeo ===== */
function pickMime(){return['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=av1,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||''}
function startRec(){
  let src=stream,w=v.videoWidth,h=v.videoHeight,fps=Math.round(stream.getVideoTracks()[0].getSettings().frameRate||30);
  if(cine){fps=+$('#fps').value;cstream=c.captureStream(fps);stream.getAudioTracks().forEach(a=>cstream.addTrack(a));src=cstream;w=c.width;h=c.height}
  const mime=pickMime();
  const bps=Math.min(120e6,Math.max(8e6,w*h*fps*.2));
  try{mr=new MediaRecorder(src,{mimeType:mime,videoBitsPerSecond:bps,audioBitsPerSecond:(mime.includes('webm')?510000:320000)})}
  catch(e){mr=new MediaRecorder(src)}
  chunks=[];mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{add(new Blob(chunks,{type:mr.mimeType||'video/webm'}),'video');mr=null;cstream=null};
  mr.start(1000);
  navigator.vibrate?.(30);navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});t0=Date.now();$('#rec').style.display='block';$('#shut').classList.add('rec');
  timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rec').textContent='● '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
}
function stopRec(){wl?.release().catch(()=>{});wl=null;navigator.vibrate?.(30);mr.stop();clearInterval(timer);$('#rec').style.display='none';$('#shut').classList.remove('rec')}

$('#shut').onclick=()=>{if(!stream)return;if(mode==='photo')photo();else mr?stopRec():startRec()};
function setMode(m){if(mr)return;mode=m;$('#audw').style.display=m==='video'?'flex':'none';$('#tp').classList.toggle('on',m==='photo');$('#tv').classList.toggle('on',m==='video');$('#shut').classList.toggle('vid',m==='video')}
$('#tp').onclick=()=>setMode('photo');$('#tv').onclick=()=>setMode('video');
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
$('#res').onchange=start;$('#mic').onchange=start;$('#amode').onchange=start;

/* ===== Galeria ===== */
function add(blob,kind){
  const url=URL.createObjectURL(blob);
  const ext=kind==='image'?'jpg':(blob.type.includes('mp4')?'mp4':'webm');
  shots.push({url,kind,name:`${cine?'cine-'+look:'cam'}_${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`});
  const t=$('#thumb');t.innerHTML=kind==='image'?`<img src="${url}">`:`<video src="${url}" muted></video>`;
}
$('#thumb').onclick=()=>{if(!shots.length)return;$('#gal').classList.add('show');show(shots.length-1);
  const st=$('#gstrip');st.innerHTML='';shots.forEach((s,i)=>{const e=document.createElement(s.kind==='image'?'img':'video');e.src=s.url;e.muted=true;e.onclick=()=>show(i);st.appendChild(e)})};
function show(i){cur=i;const s=shots[i];
  $('#gview').innerHTML=s.kind==='image'?`<img src="${s.url}">`:`<video src="${s.url}" controls autoplay playsinline></video>`;
  [...$('#gstrip').children].forEach((e,j)=>e.classList.toggle('sel',j===i));
  $('#gdl').href=s.url;$('#gdl').download=s.name}
$('#gclose').onclick=()=>{$('#gal').classList.remove('show');$('#gview').innerHTML=''};

$('#allow').onclick=async()=>{
  $('#perr').textContent='';
  if(!navigator.mediaDevices?.getUserMedia){$('#perr').textContent='Este navegador não suporta acesso à câmera.';return}
  await start();
  if(stream&&stream.active)$('#perm').classList.add('hide');
  else{$('#perr').textContent='Acesso negado. Toque no ícone de cadeado ou câmera na barra do navegador, permita o acesso e toque em “Permitir acesso” novamente.';msg('')}
};
// se a permissão já foi concedida antes, entra direto
navigator.permissions?.query({name:'camera'}).then(p=>{if(p.state==='granted')$('#allow').click()}).catch(()=>{});

/* ===== Versão app nativo: salvar/compartilhar arquivos ===== */
if(window.Capacitor?.isNativePlatform?.()){
  $('#gdl').textContent='Compartilhar';
  $('#gdl').onclick=async e=>{
    e.preventDefault();const s=shots[cur];if(!s)return;
    const {Filesystem,Share}=Capacitor.Plugins;
    try{
      const b=await (await fetch(s.url)).blob();
      const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
      const w=await Filesystem.writeFile({path:s.name,data:d,directory:'CACHE'});
      await Share.share({files:[w.uri]});
    }catch(err){alert('Não foi possível salvar: '+err.message)}
  };
}

/* ===== App nativo: salva automaticamente na galeria (álbum "Câmera Cine") ===== */
if(window.Capacitor?.isNativePlatform?.()){
  const ALB='Câmera Cine';let albId=null;
  const toast=t=>{let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);background:rgba(18,18,22,.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;transition:opacity .3s;pointer-events:none';document.body.appendChild(e)}
    e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2200)};
  async function album(){
    if(albId)return albId;
    const {Media}=Capacitor.Plugins;
    let r=await Media.getAlbums();let a=r.albums.find(x=>x.name===ALB);
    if(!a){await Media.createAlbum({name:ALB});r=await Media.getAlbums();a=r.albums.find(x=>x.name===ALB)}
    return albId=a?.identifier;
  }
  const _add=add;
  add=async(blob,kind)=>{
    _add(blob,kind);const s=shots[shots.length-1];
    try{
      const {Filesystem,Media}=Capacitor.Plugins;
      const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
      const w=await Filesystem.writeFile({path:s.name,data:d,directory:'CACHE'});
      const albumIdentifier=await album();
      await Media[kind==='image'?'savePhoto':'saveVideo']({path:w.uri,albumIdentifier,fileName:s.name.replace(/\.[^.]+$/,'')});
      toast(kind==='image'?'Foto salva na galeria ✓':'Vídeo salvo na galeria ✓');
    }catch(err){toast('Não foi possível salvar na galeria')}
  };
}
</script>
