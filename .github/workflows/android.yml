name: Gerar APK do Android

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main, master]
    tags: ['v*']            # criar uma tag v1.0 também publica o APK em Releases

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android (com permissões)
        run: npm run setup:android

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Camera-Cine.apk

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Cine-APK
          path: Camera-Cine.apk

      - name: Publicar em Releases (somente com tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Camera-Cine.apk
